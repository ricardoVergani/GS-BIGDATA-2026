resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # destino fixo: nao depende de nada que o visitante envie
    set $exporter http://exporter:9113;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /stub_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
    }

    location = /metrics {
        proxy_pass $exporter/metrics; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
}