global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Metricas internas do nginx (trafego e saturacao), lidas da URL publica
  - job_name: nginx
    metrics_path: /metrics
    static_configs:
      - targets: ["54.85.25.247:80"]

  # Teste de fora, como um usuario faria (latencia e erros)
  - job_name: site-blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      targets: ["http://54.85.25.247/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
